<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore the calendar and discover special commemorative days throughout the year."
    />
    <meta name="theme-color" content="#103c7b" />

    <title>Days Calendar</title>

    <link rel="stylesheet" href="./style.css" />

    <script type="module" src="./web.mjs"></script>
  </head>

  <body>
    <header class="site-header">
      <h1>Days Calendar</h1>
    </header>

    <main>
      <section class="calendar-section" aria-labelledby="calendar-heading">
        <div class="calendar-card">
          <header class="month-header">
            <div class="month-title">
              <p class="month-eyebrow">Discover special days</p>

              <h2 id="calendar-heading">October 2026</h2>

              <p class="month-subtitle">
                Celebrate the people, nature and events that matter.
              </p>
            </div>

            <nav
              class="month-navigation"
              aria-label="Calendar month navigation"
            >
              <button id="previous-month" type="button">Previous</button>

              <button id="next-month" type="button">Next</button>
            </nav>
          </header>

          <div class="calendar-table-wrapper">
            <table>
              <caption>
                Monthly calendar showing dates and commemorative days
              </caption>

              <thead>
                <tr>
                  <th scope="col">
                    <span class="weekday-full">Sunday</span>
                    <span class="weekday-short">Sun</span>
                  </th>
                  <th scope="col">
                    <span class="weekday-full">Monday</span>
                    <span class="weekday-short">Mon</span>
                  </th>
                  <th scope="col">
                    <span class="weekday-full">Tuesday</span>
                    <span class="weekday-short">Tue</span>
                  </th>
                  <th scope="col">
                    <span class="weekday-full">Wednesday</span>
                    <span class="weekday-short">Wed</span>
                  </th>
                  <th scope="col">
                    <span class="weekday-full">Thursday</span>
                    <span class="weekday-short">Thu</span>
                  </th>
                  <th scope="col">
                    <span class="weekday-full">Friday</span>
                    <span class="weekday-short">Fri</span>
                  </th>
                  <th scope="col">
                    <span class="weekday-full">Saturday</span>
                    <span class="weekday-short">Sat</span>
                  </th>
                </tr>
              </thead>

              <tbody id="calendar-body">
                <!-- Calendar dates are generated by web.mjs. -->
              </tbody>
            </table>
          </div>

          <div class="calendar-legend" aria-label="Calendar legend">
            <div class="legend-item">
              <span class="legend-dot today-dot" aria-hidden="true"></span>
              <span>Today</span>
            </div>

            <div class="legend-item">
              <span class="legend-dot event-dot" aria-hidden="true"></span>
              <span>Commemorative day</span>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>Days Calendar Project</p>
    </footer>
  </body>
</html>
