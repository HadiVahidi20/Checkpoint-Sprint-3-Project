<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Explore a calendar of commemorative days, discover their dates, and navigate between months and years."
    />

    <title>Days Calendar</title>

    <link rel="stylesheet" href="./style.css" />

    <script type="module" src="./web.mjs"></script>
  </head>

  <body>
    <main>
      <section class="calendar-section" aria-labelledby="calendar-heading">
        <!-- Month heading and navigation -->
        <div class="month-header">
          <div class="month-title">
            <span class="month-eyebrow"> ✦ THE MONTHLY CALENDAR ✦ </span>

            <h2 id="calendar-heading" aria-live="polite"></h2>

            <p class="month-subtitle">Celebrate the days that matter</p>
          </div>

          <nav class="month-navigation" aria-label="Calendar navigation">
            <button
              type="button"
              id="previous-month"
              aria-label="Previous month"
            >
              Previous
            </button>

            <button type="button" id="next-month" aria-label="Next month">
              Next
            </button>
          </nav>
        </div>

        <!-- Calendar card -->
        <div class="calendar-card">
          <div class="calendar-table-wrapper">
            <table>
              <caption>
                Commemorative days calendar
              </caption>

              <thead>
                <tr>
                  <th scope="col">
                    <span class="weekday-full">Sunday</span>
                    <span class="weekday-short">Sun</span>
                  </th>

                  <th scope="col">
                    <span class="weekday-full">Monday</span>
                    <span class="weekday-short">Mon</span>
                  </th>

                  <th scope="col">
                    <span class="weekday-full">Tuesday</span>
                    <span class="weekday-short">Tue</span>
                  </th>

                  <th scope="col">
                    <span class="weekday-full">Wednesday</span>
                    <span class="weekday-short">Wed</span>
                  </th>

                  <th scope="col">
                    <span class="weekday-full">Thursday</span>
                    <span class="weekday-short">Thu</span>
                  </th>

                  <th scope="col">
                    <span class="weekday-full">Friday</span>
                    <span class="weekday-short">Fri</span>
                  </th>

                  <th scope="col">
                    <span class="weekday-full">Saturday</span>
                    <span class="weekday-short">Sat</span>
                  </th>
                </tr>
              </thead>

              <tbody id="calendar-body"></tbody>
            </table>
          </div>

          <!-- Calendar legend -->
          <div class="calendar-legend">
            <div class="legend-item">
              <span class="legend-dot today-dot" aria-hidden="true"></span>

              <span>Today</span>
            </div>

            <div class="legend-item">
              <span class="legend-dot event-dot" aria-hidden="true"></span>

              <span>Commemorative Day</span>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>Days Calendar Project</p>
    </footer>
  </body>
</html>
